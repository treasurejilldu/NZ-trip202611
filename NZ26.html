<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#eef1e9"><meta name="description" content="2026 紐西蘭南島旅行｜五頁行前電子小冊子"><title>紐西蘭南島｜行前小冊子</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#24483c;background:#eef1e9}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -15%,#fff 0,#eef1e9 65%)}.shell{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:11px;padding:15px 14px max(17px,env(safe-area-inset-bottom))}.top{width:min(100%,530px);display:flex;align-items:center;justify-content:space-between;gap:10px}.heading{font-weight:750;font-size:16px;letter-spacing:.035em}.minor{color:#6d8578;font-size:11px;margin-top:3px}.counter{background:#fff;padding:7px 13px;border-radius:99px;color:#46645b;font-size:12px;border:1px solid #dce6db}.stage{position:relative;flex:1;min-height:0;width:min(100%,530px);display:flex;justify-content:center;align-items:center;perspective:1250px}.paper{width:auto;height:auto;max-width:100%;max-height:min(77dvh,900px);aspect-ratio:1055/1491;border-radius:12px;object-fit:contain;box-shadow:0 14px 45px #294b3c22,0 1px 7px #3756451d;background:#fff;transform-origin:center;backface-visibility:hidden;user-select:none;-webkit-user-drag:none}.paper.next{animation:flipNext .46s ease-in-out}.paper.prev{animation:flipPrev .46s ease-in-out}@keyframes flipNext{0%{transform:rotateY(0) scale(1)}49%{transform:rotateY(-87deg) scale(.97);filter:brightness(.8)}51%{transform:rotateY(87deg) scale(.97);filter:brightness(.8)}100%{transform:rotateY(0) scale(1)}}@keyframes flipPrev{0%{transform:rotateY(0) scale(1)}49%{transform:rotateY(87deg) scale(.97);filter:brightness(.8)}51%{transform:rotateY(-87deg) scale(.97);filter:brightness(.8)}100%{transform:rotateY(0) scale(1)}}.controls{display:flex;justify-content:space-between;align-items:center;width:min(100%,530px);gap:12px}.nav{appearance:none;border:1px solid #d6e2d9;background:white;color:#224d3e;padding:12px 17px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}.nav:disabled{opacity:.32;cursor:default}.dots{display:flex;gap:8px;align-items:center;justify-content:center}.dot{border:0;border-radius:50%;background:#c5d6ca;width:8px;height:8px;padding:0;cursor:pointer}.dot.active{background:#275746;width:22px;border-radius:15px}.foot{font-size:11px;color:#6d8274;text-align:center}.foot span{white-space:nowrap}@media(max-height:700px){.paper{max-height:70dvh}.shell{gap:7px;padding-top:8px}.nav{padding:9px 14px}}@media(prefers-reduced-motion:reduce){.paper.next,.paper.prev{animation:none}}
</style></head><body><main class="shell"><header class="top"><div><div class="heading">🇳🇿 紐西蘭南島・行前小冊子</div><div class="minor">2026.11.07 — 11.14　｜　基督城進・皇后鎮出</div></div><div class="counter"><span id="count">1</span> / 5</div></header><section class="stage" aria-label="翻頁小冊子"><img class="paper" id="page" src="page-1.webp" alt="第1頁 航班資訊" draggable="false" fetchpriority="high"></section><nav class="controls" aria-label="翻頁控制"><button class="nav" id="prev" disabled>← 上一頁</button><div class="dots" id="dots"></div><button class="nav" id="next">下一頁 →</button></nav><div class="foot">左右滑動翻頁 · 也可點擊按鈕　<span>｜五頁均可離線保存</span></div></main>
<script>
const names=['航班資訊','出發前必做','入境申報與海關','奧克蘭轉機流程','重點注意事項'];const img=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),dots=document.getElementById('dots'),count=document.getElementById('count');let current=0,busy=false,startX=null;names.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===0?' active':'');b.ariaLabel='前往第'+(i+1)+'頁';b.onclick=()=>go(i);dots.append(b);const preload=new Image();preload.src=`page-${i+1}.webp`});function update(){img.src=`page-${current+1}.webp`;img.alt=`第${current+1}頁 ${names[current]}`;count.textContent=current+1;prev.disabled=current===0;next.disabled=current===names.length-1;[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===current));history.replaceState(null,'','#page-'+(current+1))}function go(target){if(busy||target<0||target>=names.length||target===current)return;busy=true;const direction=target>current?'next':'prev';img.classList.add(direction);setTimeout(()=>{current=target;update()},225);setTimeout(()=>{img.classList.remove(direction);busy=false},470)}prev.onclick=()=>go(current-1);next.onclick=()=>go(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});const stage=document.querySelector('.stage');stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});stage.addEventListener('touchend',e=>{if(startX==null)return;let dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>45)go(current+(dx<0?1:-1));startX=null},{passive:true});let init=/page-(\d+)/.exec(location.hash);if(init){current=Math.min(4,Math.max(0,+init[1]-1));update()}
</script></body></html>
